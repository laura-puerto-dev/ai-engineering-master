[project]
name = "langgraph-master-projects"
version = "0.1.0"
description = "Hands-on LangGraph projects from my AI Engineering Master's program."
readme = "README.md"
authors = [
    { name = "Laura" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx2>=2.13.1",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.14",
    "pydantic>=2.14.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/conversational_agent"]

[tool.ruff.lint.isort]
known-first-party = ["conversational_agent"]
