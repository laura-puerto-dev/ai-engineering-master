services:
  postgres:
    image: polypheny/postgres-pgvector-postgis:17-debian
    container_name: municipal-field-operations-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-municipal_operations}
      POSTGRES_USER: ${POSTGRES_USER:-municipal_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
