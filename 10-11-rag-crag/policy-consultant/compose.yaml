services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: policy-consultant-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-policy_consultant}
      POSTGRES_USER: ${POSTGRES_USER:-policy_consultant_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
