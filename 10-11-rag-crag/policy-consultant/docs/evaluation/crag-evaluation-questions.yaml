# Final RAG-vs-CRAG evaluation set (Fase 4A): 20 questions, used ONLY for
# the final comparison between the module-10 RAG baseline and the frozen
# CRAG configuration (Fase 3C). Not a calibration set: expected results
# here must never influence any further prompt/threshold adjustment.
#
# Independent from docs/evaluation/eval-questions.yaml, docs/evaluation/
# calibration-questions.yaml (module 10) and docs/evaluation/
# crag-validation-questions.yaml (session 11 CRAG calibration, Fase 3A/
# 3B): no question here tests the same concrete fact as a question in any
# of those three files, even where the same document is reused for a
# different fact. Also independent from the three scripts/
# smoke_test_crag.py scenarios (manutención per diem, the Portugal
# business-trip/remote-work scenario, and the Mexico private pension
# plan) — none of those facts is reused or paraphrased here.
#
# category (exactly as required by the Fase 4A brief, 7/7/2/2/2):
#   direct_evidence      : answerable from a single chunk
#   multi_fragment        : answerable only by combining two chunks (often,
#                           but not necessarily, from two different
#                           documents)
#   partially_answerable  : the general rule is answerable, but the
#                           question also asks for a personal instance
#                           that is not in the corpus — CRAG must abstain
#                           rather than answer only the general part
#   no_information        : the topic is not covered anywhere in the
#                           corpus (verified against the full 12-document
#                           corpus, not only the documents visible to the
#                           question's profile)
#   access_restricted     : the real answer exists in the corpus, but is
#                           not visible to this profile under RLS (by
#                           role within the same country, or by country)
#
# expected_outcome: "answerable" or "abstain" (14 answerable / 6 abstain).
# abstain_reason (only set when expected_outcome is "abstain"), same
# vocabulary as the historical sets:
#   - no_information          : the topic is not covered anywhere in the corpus
#   - personal_data_unavailable: the policy explicitly says this depends on a
#                                personal record it does not contain
#   - insufficient_evidence   : retrieval may return topically related chunks,
#                                but none of them actually support an answer
#   - access_restricted       : an authorized document would answer this, but
#                                it is not visible under this profile's RLS context
#
# expected_evidence is always [] for an "abstain" case, even when the real
# answer (or the closest-but-insufficient chunk) is identifiable — see
# "justification" for exactly where it lives and why it does not count.
#
# profile_id values are the exact keys of web.app.DEMO_PROFILES: spain-employee,
# spain-manager, spain-hr, mexico-employee, england-employee. Mexico and
# England have no manager/hr demo profile, so every Mexico/England question
# below necessarily uses the employee profile.
#
# Every document_id/version/chunk_id/section_path below was read directly
# from the real indexed corpus (verified via a read-only SQL query against
# the real `chunks`/`documents` tables, 2026-11-25) and from the actual
# policy text in data/corpus/ — none of it is invented. allowed_roles/
# country per document were verified the same way, against the real
# `documents` table, before assigning any access_restricted question.
#
# No route (sufficient/ambiguous/insufficient) or retrieval-attempt count
# is pre-assigned to any question: CRAG's actual route/attempts depend on
# real retrieval/reranking/grading, not on this file. The RAG baseline run
# over this same file obviously has no route/attempt concept at all. This
# file only records the expected final outcome (and, for multi_fragment,
# which two chunks must be combined).

questions:
  # --- direct_evidence (7): answerable from a single chunk ---

  - id: eval-crag-01
    category: direct_evidence
    question: "¿Con cuánta antelación debo solicitar mis vacaciones en España antes del primer día que quiero disfrutar?"
    profile_id: spain-employee
    expected_outcome: answerable
    expected_answer_summary: "Con al menos 15 días naturales de antelación respecto al primer día previsto de disfrute, salvo que se aplique una excepción justificada."
    expected_aspects:
      - "Plazo ordinario de antelación: 15 días naturales"
    expected_evidence:
      - document_id: ES-001
        version: "1.0"
        chunk_id: "ES-001:1.0:4"
        section_path: ["4. Solicitud de vacaciones"]
    abstain_reason: null
    justification: "ES-001 §4 declara textualmente el plazo como regla general aplicable a cualquier solicitud, sin depender de ningún dato personal. Hecho distinto de eval-01 (ES-001:1.0:3, cuantía anual de 23 días) y eval-03 (ES-001:1.0:6, límite de 15 días consecutivos); no usado en calibration-questions.yaml, crag-validation-questions.yaml ni en el smoke test."

  - id: eval-crag-02
    category: direct_evidence
    question: "Como manager en España, si uno de mis colaboradores disfruta sus dos días anuales retribuidos por asuntos personales, ¿puedo descontarlos de su saldo de vacaciones?"
    profile_id: spain-manager
    expected_outcome: answerable
    expected_answer_summary: "No. Debo distinguir los dos días anuales retribuidos por asuntos personales de ES-002 de las vacaciones de ES-001, y no debo descontar automáticamente ese tipo de ausencia del saldo de vacaciones."
    expected_aspects:
      - "Los días de asuntos personales son distintos de las vacaciones"
      - "No deben descontarse automáticamente del saldo de vacaciones"
    expected_evidence:
      - document_id: ES-006
        version: "1.0"
        chunk_id: "ES-006:1.0:5"
        section_path: ["5. Ausencias planificadas"]
    abstain_reason: null
    justification: "ES-006 §5 (restringido a manager/hr) establece textualmente ambas reglas como instrucción operativa para el manager. Chunk no usado en ningún dataset anterior (eval-08 usa ES-006:1.0:4/:1.0:8; val-06 usa ES-006:1.0:9)."

  - id: eval-crag-03
    category: direct_evidence
    question: "Si necesito ausentarme de mi puesto en España por una cita médica, ¿durante cuánto tiempo puedo comunicar la ausencia y debo avisar con antelación?"
    profile_id: spain-employee
    expected_outcome: answerable
    expected_answer_summary: "Puede comunicarse una ausencia por el tiempo indispensable que requiera la cita; siempre que sea posible, debe avisarse con antelación al responsable directo para coordinar el trabajo pendiente."
    expected_aspects:
      - "Duración: el tiempo indispensable para la cita"
      - "Aviso previo al responsable directo cuando sea posible"
    expected_evidence:
      - document_id: ES-002
        version: "1.0"
        chunk_id: "ES-002:1.0:5"
        section_path: ["5. Citas médicas"]
    abstain_reason: null
    justification: "ES-002 §5 declara ambas reglas de forma general, sin depender de ningún diagnóstico ni dato personal. Chunk no usado en ningún dataset anterior (cal-01 usa ES-002:1.0:4; val-06 usa ES-002:1.0:10)."

  - id: eval-crag-04
    category: direct_evidence
    question: "Como responsable de RR. HH. en España, ¿en qué plazo debe presentar un empleado los gastos de un viaje de trabajo después de finalizarlo?"
    profile_id: spain-hr
    expected_outcome: answerable
    expected_answer_summary: "Dentro de los 15 días naturales posteriores a la finalización del viaje, a través del canal corporativo autorizado, y con un justificante válido para cada gasto."
    expected_aspects:
      - "Plazo de presentación: 15 días naturales tras finalizar el viaje"
    expected_evidence:
      - document_id: ES-005
        version: "1.0"
        chunk_id: "ES-005:1.0:8"
        section_path: ["8. Justificantes y presentación de gastos"]
    abstain_reason: null
    justification: "ES-005 §8 (visible para empleados, managers y RR. HH. de España) declara el plazo como regla general. Chunk no usado en ningún dataset anterior (eval-07 usa ES-005:1.0:5; cal-02 usa ES-005:1.0:4; smoke test usa ES-005:1.0:6; val-05 usa ES-005:1.0:3)."

  - id: eval-crag-05
    category: direct_evidence
    question: "¿Con cuántos días naturales de antelación debo presentar, como regla interna, una solicitud ordinaria de vacaciones en México?"
    profile_id: mexico-employee
    expected_outcome: answerable
    expected_answer_summary: "Con al menos 10 días naturales de antelación, como regla de planificación interna, siempre que sea compatible con los derechos y plazos legales aplicables."
    expected_aspects:
      - "Plazo de antelación recomendado: 10 días naturales"
    expected_evidence:
      - document_id: MX-001
        version: "1.1"
        chunk_id: "MX-001:1.1:8"
        section_path: ["5. Solicitud ordinaria de vacaciones"]
    abstain_reason: null
    justification: "MX-001 §5 (versión vigente 1.1) establece el plazo como regla general, no personal. Chunk no usado en ningún dataset anterior (eval-10 usa MX-001:1.1:3/:1.1:4; eval-11 usa MX-001:1.1:9; val-02/val-07 usan MX-001:1.1:11)."

  - id: eval-crag-06
    category: direct_evidence
    question: "In England, what is the maximum number of consecutive working days of annual leave I can ordinarily request without needing special approval?"
    profile_id: england-employee
    expected_outcome: answerable
    expected_answer_summary: "Up to 10 consecutive working days ordinarily; longer periods require advance discussion and special approval from the line manager in coordination with England HR."
    expected_aspects:
      - "Ordinary maximum: up to 10 consecutive working days"
      - "Longer periods require advance discussion and special approval"
    expected_evidence:
      - document_id: EN-001
        version: "1.0"
        chunk_id: "EN-001:1.0:5"
        section_path: ["5. Consecutive leave and team coverage"]
    abstain_reason: null
    justification: "EN-001 §5 states this as a general, year-independent rule. Chunk not used in any earlier dataset (eval-13/eval-14 use EN-001:1.0:2/:1.0:7; cal-04 uses EN-001:1.0:6; val-03 uses EN-001:1.0:10)."

  - id: eval-crag-07
    category: direct_evidence
    question: "¿Puedo usar brevemente el ordenador de la empresa para un asunto personal mientras trabajo en México?"
    profile_id: mexico-employee
    expected_outcome: answerable
    expected_answer_summary: "Sí, el uso personal incidental puede permitirse cuando sea razonable, lícito y no interfiera con el trabajo ni infrinja otras normas de la empresa."
    expected_aspects:
      - "Uso personal incidental permitido si es razonable, lícito y no interfiere con el trabajo"
    expected_evidence:
      - document_id: GLB-001
        version: "1.0"
        chunk_id: "GLB-001:1.0:6"
        section_path: ["6. Responsible use of company resources"]
    abstain_reason: null
    justification: "GLB-001 §6 declara esta regla de forma general para todo el personal, documento global probado deliberadamente con perfil de México. Chunk no usado en ningún dataset anterior (eval-02 usa GLB-001:1.0:4)."

  # --- multi_fragment (7): answerable only by combining two chunks ---

  - id: eval-crag-08
    category: multi_fragment
    question: "Como manager en España, uno de mis colaboradores solicita un periodo de vacaciones y tiene saldo suficiente. ¿Eso implica que debo aprobarlo automáticamente, y qué pasos concretos tengo que seguir antes de decidir?"
    profile_id: spain-manager
    expected_outcome: answerable
    expected_answer_summary: "No. Tener saldo suficiente no implica aprobación automática: debo valorar el calendario del equipo, los periodos de actividad crítica y la cobertura de funciones esenciales (ES-001 §5). En concreto, debo comprobar las fechas solicitadas y la cobertura operativa, identificar posibles coincidencias con otras ausencias ya aprobadas, revisar las condiciones aplicables de ES-001/ES-002, y registrar mi decisión y su justificación en el sistema corporativo (ES-006 §3)."
    expected_aspects:
      - "El saldo suficiente no implica aprobación automática"
      - "Pasos concretos antes de decidir: fechas/cobertura, coincidencias con otras ausencias, condiciones aplicables, registro de la decisión"
    expected_evidence:
      - document_id: ES-001
        version: "1.0"
        chunk_id: "ES-001:1.0:5"
        section_path: ["5. Aprobación y planificación del equipo"]
      - document_id: ES-006
        version: "1.0"
        chunk_id: "ES-006:1.0:3"
        section_path: ["3. Recepción y revisión de solicitudes"]
    abstain_reason: null
    justification: "ES-001 §5 (visible a employee/manager/hr) establece el principio general de que el saldo no implica aprobación automática, pero no detalla los pasos operativos; ES-006 §3 (restringido a manager/hr) sí los detalla, sin repetir el principio general. Ninguno de los dos fragmentos por sí solo da la respuesta completa. Ningún chunk usado en ningún dataset anterior (ES-001:1.0:3/:1.0:6 en eval-questions.yaml; ES-006:1.0:4/:1.0:8 en eval-08, ES-006:1.0:9 en val-06)."

  - id: eval-crag-09
    category: multi_fragment
    question: "Como responsable de RR. HH. en España, si un gasto de viaje va a superar los límites ordinarios de la política, ¿qué tiene que haber ocurrido antes de que se considere autorizado, y qué debo comprobar yo al revisar el caso?"
    profile_id: spain-hr
    expected_outcome: answerable
    expected_answer_summary: "Debe existir una autorización excepcional previa, documentada en los canales corporativos correspondientes; no se presume concedida por el hecho de que el viaje ya esté aprobado o el gasto ya se haya realizado (ES-005 §9). Al revisar el caso, debo identificar el concepto, el importe, el motivo de la excepción, la autorización y los justificantes pertinentes, colaborando con Finanzas cuando afecte a condiciones de personal (ES-007 §8)."
    expected_aspects:
      - "La excepción debe ser previa y documentada, nunca presumida por la aprobación del viaje o el gasto ya realizado"
      - "RR. HH. debe identificar concepto, importe, motivo, autorización y justificantes al revisar el caso"
    expected_evidence:
      - document_id: ES-005
        version: "1.0"
        chunk_id: "ES-005:1.0:9"
        section_path: ["9. Excepciones y superación de límites"]
      - document_id: ES-007
        version: "1.0"
        chunk_id: "ES-007:1.0:8"
        section_path: ["8. Gastos y desplazamientos excepcionales"]
    abstain_reason: null
    justification: "ES-005 §9 (visible a employee/manager/hr) establece la exigencia general de autorización previa documentada; ES-007 §8 (restringido a hr) detalla qué debe comprobar específicamente RR. HH. al revisar el caso, remitiendo a ES-005 sin repetir su contenido. Ningún chunk usado en ningún dataset anterior (ES-005:1.0:5/:1.0:4/:1.0:6/:1.0:3 en eval-07/cal-02/smoke test/val-05; ES-007:1.0:4/:1.0:7 en eval-09/val-08/val-11)."

  - id: eval-crag-10
    category: multi_fragment
    question: "Como responsable de RR. HH. en España, si un empleado solicita de forma recurrente teletrabajar un cuarto día cada semana además del régimen habitual de tres días, ¿qué tengo que comprobar antes de decidir, y una concesión puntual cambiaría su régimen habitual de forma permanente?"
    profile_id: spain-hr
    expected_outcome: answerable
    expected_answer_summary: "No, una excepción concedida para una semana no modifica automáticamente el régimen habitual ni crea una autorización permanente (ES-003 §6). Antes de decidir sobre una solicitud que supere el régimen ordinario de tres días semanales, debo comprobar la elegibilidad del puesto, las condiciones individuales aplicables, la valoración del responsable directo y las necesidades de coordinación del equipo (ES-007 §6)."
    expected_aspects:
      - "Una concesión puntual no modifica el régimen habitual ni crea una autorización permanente"
      - "RR. HH. debe comprobar elegibilidad del puesto, condiciones individuales, valoración del responsable y necesidades de coordinación"
    expected_evidence:
      - document_id: ES-003
        version: "1.0"
        chunk_id: "ES-003:1.0:7"
        section_path: ["6. Teletrabajo adicional y excepciones"]
      - document_id: ES-007
        version: "1.0"
        chunk_id: "ES-007:1.0:6"
        section_path: ["6. Excepciones de teletrabajo y flexibilidad"]
    abstain_reason: null
    justification: "ES-003 §6 (visible a employee/manager/hr) establece que una excepción puntual no es permanente, sin detallar qué debe comprobar RR. HH.; ES-007 §6 (restringido a hr) detalla ese checklist específico. La pregunta se formula deliberadamente sobre el régimen doméstico habitual (tres días/semana), sin tocar en ningún momento el teletrabajo desde otro país — para no solapar con el escenario 2 del smoke test (viaje a Portugal). Ningún chunk usado en ningún dataset anterior (ES-003:1.0:2/:1.0:3/:1.0:4/:1.0:6 en eval-04/val-01/val-04/smoke test; ES-007:1.0:4/:1.0:7/:1.0:8 en eval-09/val-08/val-11/eval-crag-09 de este mismo fichero)."

  - id: eval-crag-11
    category: multi_fragment
    question: "Si teletrabajo en España, ¿con qué tipo de equipo debo hacerlo, y puedo usar mi propio ordenador personal si tengo activada la autenticación en dos pasos?"
    profile_id: spain-employee
    expected_outcome: answerable
    expected_answer_summary: "Debo usar dispositivos corporativos y herramientas autorizadas; usar un portátil o una conexión segura no sustituye esa exigencia (ES-003 §7). Un dispositivo personal no está permitido para acceder a aplicaciones o datos corporativos, salvo que exista una excepción específica documentada y aprobada previamente por Seguridad de la Información — tener activada la autenticación en dos pasos no sustituye esa aprobación (GLB-002 §4)."
    expected_aspects:
      - "El teletrabajo requiere dispositivos corporativos y herramientas autorizadas"
      - "Un dispositivo personal solo se permite con una excepción documentada y aprobada previamente por Seguridad de la Información"
    expected_evidence:
      - document_id: ES-003
        version: "1.0"
        chunk_id: "ES-003:1.0:8"
        section_path: ["7. Equipamiento y seguridad de la información"]
      - document_id: GLB-002
        version: "1.0"
        chunk_id: "GLB-002:1.0:4"
        section_path: ["4. Corporate devices and approved services"]
    abstain_reason: null
    justification: "ES-003 §7 remite a GLB-002 para la exigencia de dispositivos corporativos sin detallar el mecanismo de excepción; GLB-002 §4 (documento global) establece el mecanismo exacto (excepción documentada, aprobada previamente por Seguridad de la Información) sin ser específico de teletrabajo. Ningún chunk usado en ningún dataset anterior (ES-003:1.0:2/:1.0:3/:1.0:4/:1.0:6/:1.0:7 en datasets previos y en eval-crag-10 de este mismo fichero; GLB-002:1.0:3/:1.0:7 en cal-03/smoke test)."

  - id: eval-crag-12
    category: multi_fragment
    question: "Como manager en España, un colaborador me comunica, sin haber avisado con antelación, que tiene que ausentarse por una emergencia familiar imprevista. ¿Estaba obligado a avisar con antelación en este caso, puedo exigirle que me explique el motivo médico o clínico, y qué debo hacer yo en ese momento?"
    profile_id: spain-manager
    expected_outcome: answerable
    expected_answer_summary: "No estaba obligado a avisar con antelación: no se exige una solicitud anticipada cuando la naturaleza de la emergencia lo impide (ES-002 §7). Tampoco puedo exigirle que explique el motivo médico o clínico: no debo pedir diagnósticos, informes clínicos ni explicaciones médicas detalladas. Como manager, debo confirmar la recepción de la comunicación y organizar la cobertura operativa razonable, informando a RR. HH. si resulta necesario para la tramitación administrativa (ES-006 §6)."
    expected_aspects:
      - "No existía obligación de avisar con antelación, dado que la naturaleza de la emergencia lo impedía"
      - "El manager no debe pedir diagnósticos ni detalles clínicos"
      - "El manager debe confirmar la comunicación y organizar la cobertura, informando a RR. HH. si es necesario"
    expected_evidence:
      - document_id: ES-002
        version: "1.0"
        chunk_id: "ES-002:1.0:7"
        section_path: ["7. Emergencias familiares"]
      - document_id: ES-006
        version: "1.0"
        chunk_id: "ES-006:1.0:6"
        section_path: ["6. Ausencias imprevistas y enfermedad"]
    abstain_reason: null
    justification: "La pregunta pide explícitamente tres cosas: si existía obligación de avisar con antelación, si puede exigirse una explicación médica, y qué debe hacer el manager. ES-002 §7 (visible a employee/manager/hr) resuelve la primera (no se exige aviso previo ante una emergencia que lo impida) desde la perspectiva general del empleado, sin instrucciones específicas para el manager; ES-006 §6 (restringido a manager/hr) resuelve las otras dos (no pedir diagnósticos, confirmar y organizar cobertura) sin repetir la regla general de aviso. Ninguno de los dos fragmentos por sí solo cubre las tres partes de la pregunta. Ningún chunk usado en ningún dataset anterior (ES-002:1.0:4/:1.0:10 en cal-01/val-06; ES-006:1.0:4/:1.0:8/:1.0:9 en eval-08/val-06 y ES-006:1.0:3/:1.0:5 en eval-crag-08/eval-crag-02 de este mismo fichero)."

  - id: eval-crag-13
    category: multi_fragment
    question: "In England, if I need to request annual leave with less notice than the ordinary 14 calendar days because of a specific personal circumstance, could that still be considered, and who is responsible for deciding on an exception like that?"
    profile_id: england-employee
    expected_outcome: answerable
    expected_answer_summary: "Short-notice requests may be considered where circumstances justify them, although the ordinary notice period is an internal planning expectation and does not override statutory rights (EN-001 §4). England HR is responsible for interpreting the policy and assessing exceptions, together with the relevant line manager where appropriate, and any exception must be documented (EN-001 §12)."
    expected_aspects:
      - "Short-notice requests may be considered when circumstances justify them"
      - "England HR, together with the line manager, is responsible for assessing and documenting any exception"
    expected_evidence:
      - document_id: EN-001
        version: "1.0"
        chunk_id: "EN-001:1.0:4"
        section_path: ["4. Requesting annual leave"]
      - document_id: EN-001
        version: "1.0"
        chunk_id: "EN-001:1.0:12"
        section_path: ["12. Exceptions, interpretation and related policies"]
    abstain_reason: null
    justification: "EN-001 §4 establishes that short-notice requests may be considered, without stating who is responsible for deciding; EN-001 §12 establishes who is responsible for exceptions in general, without repeating the short-notice rule itself. Neither chunk alone answers both the 'what' and the 'who'. Neither chunk used in any earlier dataset (eval-13/eval-14 use EN-001:1.0:2/:1.0:7; cal-04 uses EN-001:1.0:6; val-03 uses EN-001:1.0:10; eval-crag-06 of this same file uses EN-001:1.0:5)."

  - id: eval-crag-14
    category: multi_fragment
    question: "Antes de usar una herramienta de IA ya aprobada por la empresa para generar un primer borrador de un informe que incluye datos internos de rendimiento de mi equipo en México, ¿qué debo comprobar sobre ese tipo de información, y qué debo hacer con el contenido que genere la herramienta antes de compartirlo?"
    profile_id: mexico-employee
    expected_outcome: answerable
    expected_answer_summary: "Debo comprobar que la información interna puede introducirse en esa herramienta concreta: no debe introducirse información interna en servicios no aprobados para ese uso, salvo que Seguridad de la Información haya autorizado expresamente esa categoría (GLB-002 §6). Antes de compartir el contenido generado, debo revisarlo en cuanto a exactitud, adecuación, confidencialidad y posible sesgo, ya que sigo siendo responsable de mis decisiones profesionales y de los resultados de mi trabajo (GLB-001 §7)."
    expected_aspects:
      - "La información interna solo puede introducirse en una herramienta aprobada para ese uso, o con autorización expresa de Seguridad de la Información"
      - "El contenido generado debe revisarse por exactitud, adecuación, confidencialidad y posible sesgo antes de compartirse"
    expected_evidence:
      - document_id: GLB-001
        version: "1.0"
        chunk_id: "GLB-001:1.0:7"
        section_path: ["7. Artificial intelligence and automated tools"]
      - document_id: GLB-002
        version: "1.0"
        chunk_id: "GLB-002:1.0:6"
        section_path: ["6. Use of artificial intelligence tools"]
    abstain_reason: null
    justification: "Revisado el texto literal de GLB-002 §6 antes de reformular: la versión anterior de esta pregunta ('¿puedo usarla para resumir un contrato de un cliente?') era respondible solo con GLB-002 §6, que incluye textualmente ese mismo ejemplo ('an employee must not paste a customer contract into a public AI chatbot merely to obtain a summary...'), haciendo innecesario GLB-001 §7 — se sustituye por este hecho. En la nueva pregunta, GLB-002 §6 cubre la comprobación sobre información 'Interna' y la autorización expresa de Seguridad de la Información (aspecto ausente en GLB-001 §7, que solo lista datos de cliente/información personal/documentos confidenciales/código fuente, sin mencionar la categoría 'Interna' ni ese canal de autorización); GLB-001 §7 cubre la revisión de sesgo ('potential bias') y adecuación del contenido generado antes de compartirlo, aspecto ausente en GLB-002 §6 (que solo exige revisar exactitud, confidencialidad y manejo apropiado del material fuente, sin mencionar sesgo ni adecuación). Ningún fragmento por sí solo cubre ambos aspectos. Documentos globales probados deliberadamente con perfil de México. Ningún chunk usado en ningún dataset anterior ni en el smoke test."

