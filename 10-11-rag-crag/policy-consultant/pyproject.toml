[project]
name = "policy-consultant"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
# Heavy, GPU-aware dependencies for local embedding generation. Not
# installed by a plain `uv sync` — opt in with `uv sync --extra embeddings`.
# torch is pinned to the PyTorch project's own CUDA 12.6 wheel index (see
# [tool.uv.sources]/[[tool.uv.index]] below) rather than left to resolve
# from PyPI, so the install doesn't silently land on a CPU-only build.
#
# torch>=2.6 because sentence-transformers' own transformers dependency
# requires it for its PyTorch backend; the cu121 index (previously used
# here) only ever published up to torch 2.5.1, which is why resolving it
# alongside a current sentence-transformers failed. Verified directly
# against https://download.pytorch.org/whl/<tag>/torch/ on 2026-11-04:
# cu121 tops out at 2.5.1, cu124 at 2.6.0, cu128/cu129 cover a narrower
# recent range; cu126 is the only tag with a wide range comfortably above
# 2.6 and ongoing releases. A CUDA 12.6 wheel runs on any driver that
# supports CUDA >=12.6 (check with `nvidia-smi`); it does not need to
# match the driver's maximum supported CUDA version exactly.
embeddings = [
    "sentence-transformers>=3.0",
    "torch>=2.6",
]

# PostgreSQL + pgvector persistence (see migrations/ and compose.yaml).
persistence = [
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
]

# Claude-based answer generation (generation.py). Pinned to the version
# verified directly against the real SDK on 2026-11-11: output_config
# (effort/format), messages.parse(output_format=<pydantic model>), and
# response.parsed_output all confirmed present at this version.
generation = [
    "anthropic>=2.8.0",
]
# FastAPI demo web app (web/). A consumer of policy_consultant, never
# the reverse — see web/app.py. Depends on this package's own
# persistence/embeddings/generation extras because web/app.py composes
# all three (PostgreSQL access, local BGE-M3, Claude generation), so
# `uv sync --extra web` alone is enough to run it.
web = [
    "policy-consultant[persistence,embeddings,generation]",
    "fastapi>=0.162.5",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "types-pyyaml>=6.0.12.20261030",
]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true


[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
# sentence-transformers/torch are an optional extra (see
# [project.optional-dependencies]), not always installed in the
# environment running mypy. Treat them as untyped rather than erroring
# on missing stubs/source.
module = ["sentence_transformers.*", "torch.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# anthropic (and its transitive dependency pydantic) are the optional
# `generation` extra — not always installed in the environment running
# mypy.
module = ["anthropic.*", "pydantic.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires a running PostgreSQL instance (see compose.yaml)",
]
# web/ lives outside src/policy_consultant (deliberately — see
# web/app.py) and is therefore not installed into the environment the
# way policy_consultant is. This makes it importable from tests
# regardless of how pytest itself is invoked.
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/policy_consultant"]
